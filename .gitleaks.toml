# Extends gitleaks' default rules. Everything allowed below is test or sample data,
# never a real credential:
# - Tests/: fake tokens that prove commands get masked.
# - Curve25519 type names: declarations such as `signingKey: Curve25519.Signing.PrivateKey`.
[extend]
useDefault = true

[allowlist]
description = "Masking tests"
paths = [
  '''^Tests/StewCoreTests/''',
  '''^\.claude/''',
]
regexes = [
  '''Curve25519\.(KeyAgreement|Signing)\.(PrivateKey|PublicKey)''',
]
